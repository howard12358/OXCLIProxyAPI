name: go-contract-ci

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'sdk/**'
      - 'test/**'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'testdata/contract/**'
  push:
    branches:
      - rusty
      - main

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: |
          go test ./internal/... -count=1
          go test ./sdk/... -count=1
          go test ./test/... -count=1

  build:
    name: go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build server
        run: |
          go build -o /tmp/cli-proxy-api-check ./cmd/server
          rm -f /tmp/cli-proxy-api-check
