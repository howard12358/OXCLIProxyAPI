name: docker-embedded-image

on:
  workflow_dispatch:
    inputs:
      release_base:
        description: Release base version; workflow auto-increments patch, e.g. v0.0
        required: true
        default: v0.0
      dockerhub_namespace:
        description: Docker Hub namespace; empty uses DOCKERHUB_USERNAME secret
        required: false
        default: ""
      platforms:
        description: Comma-separated target platforms; use linux/amd64 for a fast single-architecture validation build
        required: true
        default: linux/amd64,linux/arm64
      rust_profile:
        description: Rust build profile
        required: true
        type: choice
        options:
          - release
          - debug
        default: release
      push:
        description: Push image to Docker Hub
        required: true
        type: boolean
        default: true

env:
  IMAGE_NAME: ox-cli-proxy-api

concurrency:
  group: docker-embedded-image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  docker_embedded:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Build Metadata
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          namespace="${{ inputs.dockerhub_namespace }}"
          if [ -z "${namespace}" ]; then
            namespace="${DOCKERHUB_USERNAME}"
          fi

          release_base="${{ inputs.release_base }}"
          if ! printf '%s' "${release_base}" | grep -Eq '^v[0-9]+\.[0-9]+$'; then
            echo "release_base must look like v<major>.<minor>, for example v0.0" >&2
            exit 1
          fi

          repo="${namespace}/${IMAGE_NAME}"
          repo_name="${repo#*/}"
          version_pattern="^${release_base//./\\.}\\.([0-9]+)(-debug)?$"

          token="$(
            curl -fsSL \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
              'https://hub.docker.com/v2/users/login/' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          )"

          next_patch="$(
            TAGS_JSON="$(
              if ! curl -fsSL \
                -H "Authorization: JWT ${token}" \
                "https://hub.docker.com/v2/repositories/${namespace}/${repo_name}/tags/?page_size=1000"; then
                echo '{"results":[]}'
              fi
            )" \
            VERSION_PATTERN="${version_pattern}" \
            python3 -c 'import json, os, re; payload = json.loads(os.environ["TAGS_JSON"]); pattern = re.compile(os.environ["VERSION_PATTERN"]); max_patch = max((int(match.group(1)) for item in payload.get("results", []) for match in [pattern.match(item.get("name", ""))] if match), default=-1); print(max_patch + 1)'
          )"

          version="${release_base}.${next_patch}"
          latest_tag=""
          if [ "${{ inputs.rust_profile }}" = "debug" ]; then
            version="${version}-debug"
          elif [ "${{ inputs.push }}" = "true" ]; then
            latest_tag="${repo}:latest"
          fi

          echo "DOCKERHUB_REPO=${repo}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "LATEST_TAG=${latest_tag}" >> "$GITHUB_ENV"
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${repo}:${version}"
            if [ -n "${latest_tag}" ]; then
              echo "${latest_tag}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build embedded image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.embedded
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            RUST_PROFILE=${{ inputs.rust_profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.IMAGE_TAGS }}

      - name: Verify pushed image manifests
        if: inputs.push
        shell: bash
        run: |
          set -euo pipefail

          requested_platforms="${{ inputs.platforms }}"
          if ! printf '%s' "${requested_platforms}" | grep -Eq '^linux/(amd64|arm64)(,linux/(amd64|arm64))*$'; then
            echo "platforms must be a comma-separated subset of linux/amd64,linux/arm64" >&2
            exit 1
          fi

          verify_manifest() {
            local image="$1"
            local raw
            raw="$(docker buildx imagetools inspect "${image}" --raw)"
            local platform os arch
            for platform in ${requested_platforms//,/ }; do
              os="${platform%%/*}"
              arch="${platform##*/}"
              printf '%s' "${raw}" | jq -e --arg os "${os}" --arg arch "${arch}" '
                .manifests | any(.[]; .platform.os == $os and .platform.architecture == $arch)
              ' >/dev/null
            done
            echo "verified requested manifest platforms (${requested_platforms}): ${image}"
          }

          verify_manifest "${DOCKERHUB_REPO}:${VERSION}"
          if [ -n "${LATEST_TAG}" ]; then
            verify_manifest "${LATEST_TAG}"
          fi
