name: rust-data-plane-ci

on:
  pull_request:
    paths:
      - 'rust/cliproxy-data-plane/**'
      - 'testdata/contract/**'
  push:
    branches:
      - rusty
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path rust/cliproxy-data-plane/Cargo.toml --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/cliproxy-data-plane
      - name: Run clippy
        run: cargo clippy --manifest-path rust/cliproxy-data-plane/Cargo.toml --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/cliproxy-data-plane
      - name: Run all tests
        run: cargo test --manifest-path rust/cliproxy-data-plane/Cargo.toml --all-targets
